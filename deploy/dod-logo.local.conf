# dod-logo.local - Olah Gambar (PHP + nginx). Terpasang di /etc/nginx/sites-available/dod-logo.local.conf
# Untuk server produksi: ganti server_name & root, sisanya bisa dipakai apa adanya.
server {
    listen 80;
    server_name dod-logo.local;
    root /home/imam/Projects/one-dod/public;
    index index.php;
    charset utf-8;

    # unggahan sampai 20 MB per file (+ overhead multipart)
    client_max_body_size 25m;

    # kompresi: runtime WASM 14,8 MB -> ±3-4 MB terkirim; model ONNX & JS/CSS juga
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

    # Header keamanan. Diulang di location yang memakai add_header (nginx tidak mewarisinya).
    #  - COOP/COEP: "cross-origin isolated" -> WASM multi-thread (SharedArrayBuffer) untuk Pilih Objek di browser
    #  - CSP: tanpa inline script/style & tanpa CDN; 'wasm-unsafe-eval' untuk onnxruntime-web
    set $csp "default-src 'self'; img-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy $csp always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        access_log off;

        # module JS (onnxruntime-web) wajib bertipe JavaScript
        location ~ \.mjs$ {
            types { }
            default_type application/javascript;
            expires 30d;
            add_header Cache-Control "public" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }
        # model & runtime besar: tidak berubah antar versi -> cache lama
        location ~ \.(onnx|wasm)$ {
            expires 365d;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=20M
post_max_size=25M
max_execution_time=300
memory_limit=384M";
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
